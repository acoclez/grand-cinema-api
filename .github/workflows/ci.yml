name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    name: Style, analyse statique, tests et couverture
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # historique complet pour SonarCloud

      - name: Installer PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, gd
          coverage: pcov

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Style de code (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests et couverture (PHPUnit)
        run: vendor/bin/phpunit --coverage-clover coverage/clover.xml --log-junit coverage/junit.xml

      - name: Analyse SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
